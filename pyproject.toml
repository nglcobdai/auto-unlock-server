[tool.poetry]
name = "project"
version = "0.1.4"
description = ""
authors = ["Kodai YAMASHITA <nglcobdai@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fastapi = "^0.136.3"
starlette = ">=1.3.1,<2.0.0" # CVE-2026-48710 / -54282 / -54283 対策
uvicorn = "^0.29.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.14.2"
python-dotenv = "^1.0.1"
pymongo = "^4.7.2"
python-multipart = "^0.0.31" # CVE-2026-42561 / -53537 / -53538 / -53539 / -53540 対策
openai-whisper = "^20250625"
levenshtein = "^0.25.1"
pytz = "^2024.1"
llvmlite = "0.44.0" # 暫定的にversion指定
numba = "0.61.0"    # 暫定的にversion指定
torch = ">=2.8.0,<3.0.0"   # CVE-2025-3730 対策

[tool.poetry.group.dev.dependencies]
pep8 = "^1.7.1"
black = "^26.3.1"
flake8 = "^6.1.0"
isort = "^5.12.0"
ipython = "^8.15.0"
ipykernel = "^6.25.2"
pytest = "^9.0.3"
httpx = "^0.27.0"
tornado = ">=6.5.7,<7.0.0" # CVE-2026-49853 / -49854 / -49855 対策

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 120
